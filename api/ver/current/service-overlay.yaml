overlay: 1.0.0
info:
  title: Service extension
  description: this overlay adds changes for supporting Service entities to the SKG-IF API
  version: 1.0.0
#
# this overlay file will potentially add the folowing modifications next to
# adding changes for  Service class
# (1) add FacilityPortal class to model information about place & organisation that facilitates the service
# (2) modify Venue core entity, with a new type "portal" allowing Venue to model information about place and organisation facilitating the service
# (3) modify Organisation core entity with new organisation types, allowing modelling of information about place and organisation facilitating the service via the "relevant_organisations" property. this does not determine the role of the organisation is this specific relation, but only suggests it.
# (4) add a new "related_organisations" property folowing  "related_products". with the folwing relation types: "research_infrastructure", "portal", "hosting_legal_entity" and "other". this allows more deterministic to specify a specific relation between a service and organisation.
# (5) use two separate properties: "research_infrastructure" and "hosting_legal_entity" to model the roles of organisations in managing & operating the service
# option (4) makes (3) superfluous since it allows relations of type "other"
# option (5) is semanticaly more accurate than option (3)
# for now v1.0.0 enables option (2) and (5) 
  
actions:
  - target: $.tags
    update:
      - name: Service
        description: service operations (skg-if srv extension)
  - target: $.paths
    update:
      '/services':
        get:
          tags:
            - Service
          summary: Get list of service. 
          operationId: getServices
          description: |
              Get a list of `service`. See definition in SKG-IF [Service] (https://skg-if.github.io/interoperability-framework/docs/service.html) (entity_type: service ).

              __Attribute filters__ \
              You can filter using these attributes of the `service` object. Exact match.
              The `country` filter is a shorthand that resolves via `srv_has_hosting_organisation.country`.

              | Filter key | Attribute filter example |
              | -------- | -------- |
              | entity_type | `entity_type:service` |
              | identifiers.scheme | `identifiers.scheme:handle` |
              | identifiers.value | `identifiers.value:https://hdl.handle.net/11234/1-1702` |
              | name | `name:UDPipe` |
              | website | `website:https://ufal.mff.cuni.cz/udpipe` |
              | country | `country:CZ` (shorthand for `srv_has_hosting_organisation.country`) |
              | srv_invocation_type | `srv_invocation_type:sshocinvt:webApplication` |
              | relevant_organisations.name | `relevant_organisations.name:CLARIN` |
              | relevant_organisations.identifiers.scheme | `relevant_organisations.identifiers.scheme:ror` |
              | relevant_organisations.identifiers.value | `relevant_organisations.identifiers.value:https://ror.org/03wp25384` |
              | srv_has_hosting_legal_entity.name | `srv_has_hosting_legal_entity.name:Charles University` |
              | srv_has_hosting_legal_entity.identifiers.scheme | `srv_has_hosting_legal_entity.identifiers.scheme:ror` |
              | srv_has_hosting_legal_entity.identifiers.value | `srv_has_hosting_legal_entity.identifiers.value:https://ror.org/024d6js02` |
              | srv_has_hosting_organisation.name | `srv_has_hosting_organisation.name:LINDAT` |
              | srv_has_hosting_organisation.identifiers.scheme | `srv_has_hosting_organisation.identifiers.scheme:ror` |
              | srv_has_hosting_organisation.identifiers.value | `srv_has_hosting_organisation.identifiers.value:https://ror.org/00dd4fz34` |
              | srv_has_research_infrastructure.name | `srv_has_research_infrastructure.name:CLARIN ERIC` |
              | srv_has_research_infrastructure.identifiers.scheme | `srv_has_research_infrastructure.identifiers.scheme:ror` |
              | srv_has_research_infrastructure.identifiers.value | `srv_has_research_infrastructure.identifiers.value:https://ror.org/03wp25384` |

              __Convenience filters__ \
              These filters aren't attributes of the `service` object, but they're handy for solving some common use cases.

              | Filter key | Filter value | List returned | Attribute filter example |
              | -------- | -------- | ------- | ------- |
              | cf.search.name | a string | `service` with name containing the filter value | `cf.search.name:UDPipe` |
              | cf.search.keyword | a string | `service` with keyword containing the filter value | `cf.search.keyword:morphology` |
              | cf.search.org_name | a string | `service` with any related organisation `name` or `short_name` containing the filter value (searches across `relevant_organisations`, `srv_has_hosting_legal_entity`, `srv_has_hosting_organisation`, `srv_has_research_infrastructure`) | `cf.search.org_name:LINDAT` |

              __Query parameter syntax examples__ \

               * `/services?filter=identifiers.scheme:handle,identifiers.value:https://hdl.handle.net/11234/1-1702`
               * `/services?filter=cf.search.name:UDPipe`
               * `/services?filter=cf.search.keyword:morphology`
               * `/services?filter=cf.search.name:UDPipe&page=1&page_size=5`
               * `/services?filter=country:CZ&page=1&page_size=10`
               * `/services?filter=srv_invocation_type:sshocinvt:webApplication`
               * `/services?filter=relevant_organisations.name:CLARIN`
               * `/services?filter=srv_has_hosting_organisation.name:LINDAT`
               * `/services?filter=srv_has_research_infrastructure.name:CLARIN ERIC`
               * `/services?filter=srv_has_hosting_legal_entity.identifiers.scheme:ror,srv_has_hosting_legal_entity.identifiers.value:https://ror.org/024d6js02`
               * `/services?filter=relevant_organisations.identifiers.scheme:ror,relevant_organisations.identifiers.value:https://ror.org/03wp25384`
               * `/services?filter=cf.search.org_name:LINDAT`

          parameters:
            - name: filter
              in: query
              description: |
                Search filter. Format : Coma separated filter_name:filter_value elements ( filter_name_1:filter_value_1,filter_name_2:filter_value_2,filter_name_3:filter_value_3... ). Server side operator used is _AND_.
              schema:
                type: string
                pattern: '^(,?.+:.+)*$'
              examples:
                service_name_ex:
                  value: cf.search.name:UDPipe
                  summary: Get all services with name containing `UDPipe`
                service_country_ex:
                  value: country:CZ
                  summary: Get all services in country CZ
                service_identifier_ex:
                  value: identifiers.scheme:handle,identifiers.value:https://hdl.handle.net/11234/1-1702
                  summary: Get service with specific handle identifier
                service_keyword_ex:
                  value: cf.search.keyword:morphology
                  summary: Get all services with keyword containing `morphology`
                service_org_name_ex:
                  value: relevant_organisations.name:CLARIN
                  summary: Get all services with relevant organisation named `CLARIN`
                service_hosting_org_ex:
                  value: srv_has_hosting_organisation.name:LINDAT
                  summary: Get all services hosted by organisation `LINDAT`
                service_ri_ex:
                  value: srv_has_research_infrastructure.name:CLARIN ERIC
                  summary: Get all services of research infrastructure `CLARIN ERIC`
                service_legal_entity_ror_ex:
                  value: srv_has_hosting_legal_entity.identifiers.scheme:ror,srv_has_hosting_legal_entity.identifiers.value:https://ror.org/024d6js02
                  summary: Get all services hosted by legal entity with ROR `024d6js02`
                service_org_ror_ex:
                  value: relevant_organisations.identifiers.scheme:ror,relevant_organisations.identifiers.value:https://ror.org/03wp25384
                  summary: Get all services with relevant organisation by ROR identifier
                service_search_org_ex:
                  value: cf.search.org_name:LINDAT
                  summary: Get all services related to any organisation with name or short_name containing `LINDAT`
                service_invocation_ex:
                  value: srv_invocation_type:sshocinvt:webApplication
                  summary: Get all web application services
            - $ref: '#/components/parameters/pageQueryParam'
            - $ref: '#/components/parameters/pageSizeQueryParam'
          responses:
            '200':
              description: Success
              content:
                application/json:
                  schema:
                    properties:
                      "@context":
                        type: array
                        description: JSON-LD context # not displayed in Stoplight elements
                        minItems: 4 # http://../skg-if.json, http://../skg-if-api.json, http://../skg-if-ext-serv.json and @base
                        uniqueItems: true
                        items:
                          anyOf:
                            - $ref: '#/components/schemas/JsonLdCtxDataModel'
                            - $ref: '#/components/schemas/JsonLdCtxSearch'
                            - $ref: '#/components/schemas/JsonLdCtxBaseOrMore'
                            - $ref: '#/components/schemas/JsonLdCtxExt-srv'
                        examples:
                          - ["https://w3id.org/skg-if/context/1.1.0/skg-if.json", "https://w3id.org/skg-if/context/1.0.0/skg-if-api.json", {"@base": "https://w3id.org/skg-if/sandbox/my-skg-acronym/"}, "https://w3id.org/skg-if/extension/srv/context/skg-if.json"]
#add the 4th JsonLdCtx
                      meta:
                        type: object
                        $ref: '#/components/schemas/Meta'
                      "@graph":
                          type: array
                          items:     
                            $ref: '#/components/schemas/Service'
                    required: [ "@context", "meta", "@graph" ]
                    
  - target: $.paths
    update:
      '/services/{short_local_identifier}':
        get:
          tags:
            - Service
          summary: Get service by id
          description: |
              Get a single `service`. See definition in SKG-IF extension [Service](https://skg-if.github.io/interoperability-framework/docs/service.html) ( entity_type:service ).
          operationId: getServiceById
          parameters:
              - $ref : '#/components/parameters/shortLocalIdPathParam'
          responses:
            '200':
              description: Success
              content:
                # not 'application/json-ld' to be compatible with StopLight PRISM tool
                application/json: 
                  schema:
                    required: ["@context", "@graph"]
                    properties:
                      "@context":
                         type: array
                         description: JSON-LD context # not displayed in Stoplight elements
                         minItems: 4 # http://../skg-if.json, http://../skg-if-api.json, http://../skg-if-ext-serv.json and @base
                         uniqueItems: true
                         items:
                            anyOf:
                              - $ref: '#/components/schemas/JsonLdCtxDataModel'
                              - $ref: '#/components/schemas/JsonLdCtxSearch'
                              - $ref: '#/components/schemas/JsonLdCtxBaseOrMore'
                              - $ref: '#/components/schemas/JsonLdCtxExt-srv'
                         examples:
                           - ["https://w3id.org/skg-if/context/1.1.0/skg-if.json", "https://w3id.org/skg-if/context/1.0.0/skg-if-api.json", {"@base": "https://w3id.org/skg-if/sandbox/my-skg-acronym/"}, "https://w3id.org/skg-if/extension/srv/context/skg-if.json"]
                      "@graph":
                        type: array
                        minItems: 1
                        maxItems: 1
                        items:
                          $ref: "#/components/schemas/Service"
            '404':
              description: |
                Error if entity does not exist

  - target: $.components.parameters
    update:
      filterQueryParam: # filterQueryParam duplicated in each search endpoint ( only way to add distinct examples for each endpoint )
        name: filter
        in: query
        description: |
            Search filter. Format : Coma separated filter_name:filter_value elements ( filter_name_1:filter_value_1,filter_name_2:filter_value_2,filter_name_3:filter_value_3... ). Server side operator used is _AND_.
        schema:
          type: string
          pattern: '^(,?.+:.+)*$'

  - target: $.components.schemas
    update:
      JsonLdCtxExt-srv:
        type: string
        description: "URL to SKG-IF service extension data model context"
        enum:
          - https://w3id.org/skg-if/extension/srv/context/skg-if.json
        x-faker:
          fake: ['https://w3id.org/skg-if/extension/srv/context/skg-if.json']

      Service:
        type: object
        title: 'Service'
        description:  "`service` object. See definition in SKG-IF [Service](https://skg-if.github.io/...) ( entity_type:service )."
        allOf:
          - $ref: "#/components/schemas/Entity"
          - type: object
            required: [
              "local_identifier","entity_type","name"
            ]
            properties:
              entity_type:  # was already specified, in /components/schemas/Entity?
                type: string
                default: "service"
                x-faker:
                  fake: ["service"]
              identifiers:
                type: array
                items:
                  properties:
                    scheme: 
                      type: string
                      x-faker: 
                        helpers.arrayElement: [["url"]]
                      examples:
                        - "ELG catalogue"
                    value: 
                      type: string
                      x-faker:
                        fake : ['{{internet.url}}/record/{{random.alphaNumeric(8)}}']
                      examples:
                        - "https://live.european-language-grid.eu/catalogue/tool-service/18189"
              name:
                type: string
                description: The canonical (English) name of the service. Maps to foaf:name.
                examples:
                  - "UDPipe"
              other_names:
                type: array
                description: Accepted alternative names of the service (e.g. native language names, short codes). Maps to skos:altLabel.
                items:
                  type: string
                examples:
                  - ["UDPipe 工具"]

              descriptions:
                type: object
                description: |
                  The descriptions of a `service` (multiple for multilinguism).\
                  The object is a dictionary, the keys represent language codes following [ISO 639-1](https://en.wikipedia.org/wiki/ISO_639-1).\
                  The special key `none` is reserved whenever the information about the language is not available or cannot be shared.
                patternProperties:
                  "^([a-z]{2}|none)$":
                    type: array
                    items:
                      type: string
                      x-faker:
                       random.words: [ 20 ]
                examples:
                   - {"en": ["UDPipe 2 is a Python prototype, capable of performing tagging, lemmatization and syntactic analysis of CoNLL-U input. It took part in several competitions, reaching excellent results in all of them", "Summary"], "cs": ["UDPipe je trénovatelný nástroj pro tokenizaci, tagging, lemmatizaci a závislostní parsing CoNLL-U souborů. UDPipe je jazykově nezávislý a pro natrénování modelů využívá anotovaná data ve formátu Universal Dependencies"] }

              srv_audience_byrole:
                description:  The audience(s) for which the service is intended to be used. This can  both express desire and/or design of the service operators. Values are defined in "https://vocabs.sshopencloud.eu/vocabularies/sshoc-audience/audienceScheme", and should be used with prefix "sshocaudience" defined in the context.
                type: array
                items:
                  type: string
                  pattern: "^sshocaudience:[A-Za-z0-9._-]+$"
                examples:
                  - ["sshocaudience:public", "sshocaudience:student" ]

              srv_audience_byjurisdiction:
                description: "The jurisdiction(s) given by the service operator's legal status that limit the audience. Values from the EOSC Service Profile DS_JURISDICTION vocabulary: https://eosc-service-profile.readthedocs.io/en/5.0/_vocabularies/DS_JURISDICTION.html"
                type: array
                items:
                  type: string
                  enum: ["Global", "Institution", "National", "Regional", "Research Infrastructure", "e-Infrastructure"]
                examples:
                  - ["Global"]
                  - ["National", "Regional"]
              disciplines:
                type: array
                description: |
                  Disciplines to which the service is dedicated, using Library of Congress Classification codes (https://id.loc.gov/authorities/classification).
                  Use the prefix `loc:` defined in the context. In case the service is discipline-agnostic, use `["all"]`.
                items:
                  type: string
                examples:
                  - ["loc:P98-98.5"]
                  - ["all"]

              srv_keywords:
                type: array
                description: Keywords relevant for service discovery. Values may be simple strings or concept URIs. Maps to schema:keyword.
                items:
                  type: string
                examples:
                  - ["https://www.wikidata.org/wiki/Q30642", "parsing", "NLP"]

              is_accessible_for_free:
                description: A property to flag that the Service is accessible for free, in the academic world most services are free or have a free modus
                type: boolean
                default: true

              srv_invocation_type:
                type: array
                description:  The way the service is used or called. multiple values are possible, access rights and licenses are assumed to be the same, the property values are defined in "https://vocabs.sshopencloud.eu/vocabularies/invocation-type/" and should be used with the prefix "sshocinvt" defined in the context.
                items:
                  type: string
                  pattern: "^sshocinvt:[A-Za-z0-9._-]+$"
                examples:
                  - ["sshocinvt:restfullWebservice", "sshocinvt:webApplication" ]

              srv_life_cycle_status:
                type: array
                description: indicates the development cycle and/or maturity status of the service, the property values are defined in the skos schema "https://vocabs.sshopencloud.eu/vocabularies/eosc-life-cycle-status/" and should be used with the prefix "elcs" defined in the context.
                items:
                  type: string
                  pattern: "^elcs:[A-Za-z0-9._-]+$"
                examples:
                  - ["elcs:life_cycle_status_production", "elcs:TRL6" ]

              website:
                 type: string
                 description: The landingpage or website URL for a Service.
                 examples:
                   - "https://ufal.mff.cuni.cz/udpipe"

              srv_availability_geographic:
                type: array
                description: list of countries and regions where the service is available, the property values are defined in the skos schema "https://vocabs.sshopencloud.eu/vocabularies/eosc-geographical-availability" and should be used with the prefix "eoscgeoavail"  defined in the context.
                items:
                  type: string
                  pattern: "^eoscgeoavail:[A-Za-z0-9._-]+$"
                examples:
                  - ["eoscgeoavail:eu", "eoscgeoavail:uk"]

              srv_supported_language:
                type: array
                description: The languages supported by the service
                items:
                  type: string
                  pattern: "^lexvo-iso639-3:[a-z]{3}$"
                examples:
                   - ["lexvo-iso639-3:eng", "lexvo-iso639-3:nld"]

              srv_deployment_of:
                type: array
                description: Research Product of type software, software class or sourcecode repository link that the service is based on.
                items:
                  type: object
                  required: ["@id", "@type"]
                  properties:
                    "@id":
                      type: string
                      format: uri
                      description: IRI identifying the service software 
                    "@type":
                      type: string
                      description: >
                        RDF type of the referenced service software, expressed as a CURIE
                        (e.g. schema:SoftwareSourceCode, skg:research_product)
                      pattern: "^[A-Za-z][A-Za-z0-9._-]*:[A-Za-z0-9._-]+$"
                examples:
                  -  [ { "@id": "https://github.com/ufal/udpipe", "@type": "schema:SoftwareSourceCode"}, { "@id": "http://example.org/research_product/RP_101", "@type": "skg:research_product"} ]

              srv_has_hosting_legal_entity:
                description: organisation (legal entity) legally responsible for the hosted service. May be a local_identifier for an Organisation or an Organisation object.
                anyOf:
                  - type: string
                    format: uri
                    description: local_identifier of the Organisation
                  - $ref: '#/components/schemas/Organisation'
                examples:
                    - local_identifier: https://ror.org/024d6js02
                      entity_type: 'organisation'
                      identifiers: [ {scheme: "ror", value: "https://ror.org/024d6js02"}, {scheme: "ISNI", value: "0000 0004 1937 116X"} ]
                      name: "Charles University"
                      website: https://www.cuni.cz
                      types: [education, research]
                      country: CZ
                

              srv_has_hosting_organisation:
                type: array
                description: organisation responsible for hosting and operating the service. Each item may be a plain identifier string or a full Organisation object.
                items:
                  anyOf:
                    - type: string
                      format: uri
                      description: local_identifier of the Organisation
                    - $ref: '#/components/schemas/Organisation'
                example:
                  - local_identifier: https://ror.org/00dd4fz34
                    entity_type: 'organisation'
                    name: "Digital Research Infrastructure for Language Technologies, Arts and Humanities"
                    short_name: "LINDAT"
                    types: [facility, hosting_organisation]
                    country: CZ

              srv_has_research_infrastructure:
                type: array
                description: research infrastructure organisation(s) involved. Each item may be a plain identifier string or a full Organisation object.
                items:
                  anyOf:
                    - type: string
                      format: uri
                      description: local_identifier of the Organisation
                    - $ref: '#/components/schemas/Organisation'
                example:
                  - local_identifier: https://ror.org/03wp25384
                    entity_type: 'organisation'
                    identifiers:
                      - scheme: ror
                        value: https://ror.org/03wp25384
                    name: "CLARIN ERIC"
                    types: [facility, research_infrastructure]
                    country: NL

              srv_venues:
                type: array
                description: provide reference to portal/venue through which the service is advertised (catalogue) and accessible. Each item may be a local_identifier for a Venue or a Venue object.
                items:
                  anyOf:
                    - type: string
                      format: uri
                      description: local_identifier of the Venue
                    - $ref: '#/components/schemas/Venue'
                example:
                   - local_identifier: https://ror.org/03sj9b840
                     entity_type: "venue"
                     name: "EOSC node"
                     website: https://open-science-cloud.ec.europa.eu/support/getting-started-eosc-eu-node
                     types: [srv_portal]
                   - local_identifier: https://ror.org/00zpk0t94
                     entity_type: "venue"
                     name: Arctic Portal
                     types: [srv_portal]
                     website: https://arcticportal.org 
                   - local_identifier: https://portal.ariadne-infrastructure.eu
                     entity_type: "venue"
                     name: "Ariadne portal"
                     types: [srv_portal]
                     website: https://portal.ariadne-infrastructure.eu/about

              related_products:
                description: mainly used for noting citation of the use of services, non-local identifiers can be used for external references.
                $ref: '#/components/schemas/ProductRelated'
                examples:
                  - cites: ["10.18653/v1/k17-3009", "10.30564/fls.v6i5.6957", "10.18653/v1/k18-2020"]

              srv_api_profile:
                description: IRI of the API profile/standard, either simple link or complex (embedded) structure
                anyOf:
                  - type: string
                    format: uri
                  - $ref: "#/components/schemas/srv_api_profile"
                example:
                  - "https://lindat.mff.cuni.cz/services/udpipe/api-reference.php"

              topics:
                type: array
                description:  List of `topic` covered by the `service`
                items:
                  required: [ "term" ]
                  properties:
                    term:
                      description: Identifier of a `topic`. May be a plain identifier string or a full Topic object.
                      anyOf:
                        - type: string
                          description: Topic identifier (local_identifier or external URI)
                        - $ref: '#/components/schemas/Topic'
                    # provenance: deferred — will be added as a general extension across all SKG-IF entities
                examples:
                  - - term:
                        local_identifier: "https://www.wikidata.org/wiki/Q8162"
                        entity_type: "topic"
                        identifiers:
                          - scheme: "wikidata"
                            value: "https://www.wikidata.org/wiki/Q8162"
                        labels:
                          en: "Linguistics"
                    - term:
                        local_identifier: "https://www.wikidata.org/wiki/Q30642"
                        entity_type: "topic"
                        identifiers:
                          - scheme: "wikidata"
                            value: "https://www.wikidata.org/wiki/Q30642"
                        labels:
                          en: "Natural Language Processing"

              relevant_organisations:
                type: array
                description: >
                  List of relevant Organisation identifiers associated with the `service`, in case
                  individual affiliations do not fit the contribution or are not available.
                  Each item may be a plain identifier string (local_identifier or external URI such
                  as a ROR URL) or a full Organisation object. API responses may expand identifiers
                  to full Organisation objects.
                items:
                  anyOf:
                    - type: string
                      format: uri
                      description: local_identifier of the Organisation
                    - $ref: '#/components/schemas/Organisation'
                examples:
                  # Flat identifier list (input / storage form)
                  - - "https://ror.org/024d6js02"
                    - "https://ror.org/03wp25384"
                  # Expanded Organisation objects (API response form)
                  - - local_identifier: https://ror.org/00dd4fz34
                      entity_type: organisation
                      name: "Digital Research Infrastructure for Language Technologies, Arts and Humanities"
                      short_name: "LINDAT"
                      types: [facility, hosting_organisation]
                      country: CZ
                    - local_identifier: https://ror.org/024d6js02
                      entity_type: organisation
                      name: "Charles University"
                      types: [education, research]
                      country: CZ
                    - local_identifier: https://ror.org/03wp25384
                      entity_type: organisation
                      name: "CLARIN ERIC"
                      types: [facility, research_infrastructure]
                      country: NL

#some additional organisation types should be added, see below

      srv_api_profile:
        type: object
        description: API profile (endpoint + one or more spec document urls).
        required: ["dcat:endpointURL", "schema:url"]
        properties:
          "dcat:endpointURL":
            minitems: 1
            maxitems: 1
            type: array
            items:
              type: string
              format: uri
          "schema:url":
            type: array
            minitems: 1
            items:
              type: string
              format: uri
        example: 
          "dcat:endpointURL":
            - "https://lindat.mff.cuni.cz/services/udpipe/api/process"
          "schema:url":
            - "https://lindat.mff.cuni.cz/services/udpipe/"
            - "https://lindat.mff.cuni.cz/services/udpipe/api-reference.php"
            - "https://ufal.mff.cuni.cz/udpipe"

  - target: $.components.schemas.Service
#
# FacilityPortal is a special class to model place and organisation facilitation a service
# alternatively this can be done by adding types to venue and/or organisation
# could be useful outside Service
#
    update:
      FacilityPortal:
        type: object
        description: FacilityPortal is the organization & facility that operates services and provides portal access to the service
        website:
          type: string
          description: The homepage or website URL the FacilityPortal.
          examples:
            - https://www.diamond.ac.uk/Instruments.html
            - https://www.hpc.cam.ac.uk/
            - https://gate.ac.uk
            - https://cdh.uu.nl/about/humanities-it-services/
        provider: 
          minItems: 1 

# CORE ENTITY EXTENSIONS
# The following sections extend core SKG-IF entities (Venue, Organisation).
# These modifications can be removed if the core entities are updated to
# include these types natively, or if a different approach is preferred.

# VENUE EXTENSION - BEGIN
# Adds srv_portal type and services property to Venue entity
# Remove this section if Venue is extended in the core or no longer needed

  - target: $.components.schemas.Venue.allOf[1].properties.type.enum
    update:
        - srv_portal

  - target: $.components.schemas.Venue.allOf[1].properties
    update:
      services:
        description: An array of Service objects that are discoverable (catalog) and accessible through the Venue/Portal
        type: array
        items:
          $ref: '#/components/schemas/Service'

# VENUE EXTENSION - END

# ORGANISATION EXTENSION - BEGIN
# Adds new organisation types for modeling service operations:
# - hosting_organisation: organisation responsible for hosting a service
# - research_infrastructure: organisation providing facilities for research
# Remove this section if Organisation is extended in the core

  - target: $.components.schemas.Organisation.allOf[1].properties.types.items.enum
    update:
      - research_infrastructure
      - hosting_organisation

# ORGANISATION EXTENSION - END

